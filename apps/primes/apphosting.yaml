scripts:
  buildCommand: . tools/cloud-build-prebuild.sh && ./tools/nx bundle @preem-machine/primes --verbose
  runCommand: node dist/apps/primes/.next/standalone/apps/primes/server.js
outputFiles:
  serverApp:
    include:
      - dist/apps/main/.next/standalone
      - dist/apps/main/.next/static
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512
# Environment variables and secrets.
env:
  - variable: CI
    value: 'true'
    availability:
      - BUILD
  - variable: CLOUD_BUILD
    value: 'true'
    availability:
      - BUILD
  - variable: FORCE_COLOR
    value: '0'
    availability:
      - BUILD
      - RUNTIME
  - variable: NODE_OPTIONS
    value: '--max-old-space-size=3072'
    availability:
      - BUILD
  - variable: NX_DAEMON
    value: 'false'
    availability:
      - BUILD
      - RUNTIME
  - variable: NO_COLOR
    value: '1'
    availability:
      - BUILD
  - variable: NX_SKIP_NX_CACHE
    value: 'true'
    availability:
      - BUILD
  - variable: NX_CACHE_DIRECTORY
    value: '/tmp/nx-cache'
    availability:
      - BUILD
      - RUNTIME
  - variable: PATH
    value: /workspace/node_modules/.go/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    availability:
      - BUILD
  - variable: AUTH_URL
    secret: AUTH_URL
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
  - variable: DOTENV_SECRETS
    secret: DOTENV_SECRETS
  - variable: NEXT_PUBLIC_DEBUG_AUTH
    secret: NEXT_PUBLIC_DEBUG_AUTH
  - variable: NEXT_PUBLIC_DEBUG_DATASTORE
    secret: NEXT_PUBLIC_DEBUG_DATASTORE
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    secret: NEXT_PUBLIC_FIREBASE_DATABASE_URL
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_PROJECT_ID
    secret: NEXT_PUBLIC_PROJECT_ID
  - variable: NEXT_PUBLIC_ORIGIN
    secret: NEXT_PUBLIC_ORIGIN
  - variable: NEXT_PUBLIC_STRIPE_ENABLED
    secret: NEXT_PUBLIC_STRIPE_ENABLED
  - variable: NEXT_PUBLIC_STRIPE_API_KEY
    secret: NEXT_PUBLIC_STRIPE_API_KEY
  - variable: NEXT_PUBLIC_USE_HTTPS
    secret: NEXT_PUBLIC_USE_HTTPS
  - variable: SERVICE_ACCOUNT_CLIENT_EMAIL
    secret: SERVICE_ACCOUNT_CLIENT_EMAIL
  - variable: SERVICE_ACCOUNT_PRIVATE_KEY
    secret: SERVICE_ACCOUNT_PRIVATE_KEY
  - variable: STRIPE_API_KEY
    secret: STRIPE_API_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
