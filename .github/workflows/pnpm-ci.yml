name: PNPM CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  pnpm-ci:
    name: PNPM CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for changes in package files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'package.json'
              - 'pnpm-lock.yaml'

      - name: Install pnpm
        if: steps.filter.outputs.packages == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.filter.outputs.packages == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: PNPM CI
        if: steps.filter.outputs.packages == 'true'
        run: pnpm install --frozen-lockfile
